<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.7;
            color: #e4e4e7;
            background: #0a0a0a;
        }

        header {
            padding: 4rem 2rem 2rem;
            text-align: center;
            border-bottom: 1px solid #27272a;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #fafafa;
        }

        header p {
            font-size: 1rem;
            color: #a1a1aa;
        }

        nav {
            padding: 2rem;
            text-align: center;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #a1a1aa;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #fafafa;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
        }

        .blog-post {
            padding: 2rem 0;
            border-bottom: 1px solid #27272a;
        }

        .blog-post:last-child {
            border-bottom: none;
        }

        .blog-post h2 {
            color: #fafafa;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .blog-post h2 a {
            text-decoration: none;
            color: inherit;
            transition: color 0.2s;
        }

        .blog-post h2 a:hover {
            color: #71717a;
        }

        .post-meta {
            color: #71717a;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .post-excerpt {
            color: #a1a1aa;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .post-content {
            color: #a1a1aa;
            line-height: 1.8;
        }

        .post-content h3 {
            color: #fafafa;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            font-size: 1.3rem;
        }

        .post-content h4 {
            color: #fafafa;
            margin-top: 1.2rem;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .post-content p {
            margin-bottom: 1rem;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1.5rem 0;
        }

        .post-content ul, .post-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .post-content code {
            background: #27272a;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.9rem;
        }

        .post-content pre {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        .post-content pre code {
            background: none;
            padding: 0;
        }

        .read-more {
            color: #fafafa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .read-more:hover {
            color: #71717a;
        }

        .tags {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .tag {
            color: #71717a;
            font-size: 0.85rem;
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            margin-top: 2rem;
            border-top: 1px solid #27272a;
            color: #71717a;
            font-size: 0.9rem;
        }

        footer a {
            color: #a1a1aa;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #fafafa;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #71717a;
        }

        @media (max-width: 768px) {
            header {
                padding: 3rem 1.5rem 1.5rem;
            }

            header h1 {
                font-size: 1.75rem;
            }

            .container {
                padding: 1.5rem;
            }

            nav ul {
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>My Blog</h1>
        <p>Thoughts and ideas</p>
    </header>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="admin.html">Admin</a></li>
        </ul>
    </nav>

    <div class="container" id="posts-container">
        <div class="loading">Loading posts...</div>
    </div>

    <footer>
        <p>© 2025 My Blog</p>
        <p><a href="https://github.com/yourusername">GitHub</a> · <a href="mailto:your.email@example.com">Email</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const CONFIG = {
            owner: 'eslammedhat',  // CHANGE THIS
            repo: 'eslammedhat,github.io',       // CHANGE THIS
            postsFile: 'posts.json'
        };

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        async function loadPosts() {
            const container = document.getElementById('posts-container');

            try {
                const response = await fetch(`https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/main/${CONFIG.postsFile}`);

                if (!response.ok) {
                    throw new Error('Posts file not found');
                }

                const data = await response.json();
                const posts = data.posts || [];

                if (posts.length === 0) {
                    container.innerHTML = `
                        <div class="blog-post">
                            <h2>No posts yet</h2>
                            <p class="post-excerpt">
                                Visit <a href="admin.html" style="color: #fafafa;">the admin panel</a> to create your first post!
                            </p>
                        </div>
                    `;
                    return;
                }

                posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                container.innerHTML = posts.map(post => {
                    const contentHtml = post.content ? marked.parse(post.content) : '';

                    return `
                        <article class="blog-post">
                            <h2>${post.external_link ? `<a href="${post.external_link}" target="_blank">${post.title}</a>` : post.title}</h2>
                            <div class="post-meta">
                                ${formatDate(post.date)}
                            </div>
                            ${post.description ? `<p class="post-excerpt">${post.description}</p>` : ''}
                            ${contentHtml ? `<div class="post-content">${contentHtml}</div>` : ''}
                            ${post.external_link ? `<a href="${post.external_link}" target="_blank" class="read-more">Read more →</a>` : ''}
                            ${post.tags && post.tags.length > 0 ? `
                                <div class="tags">
                                    ${post.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                                </div>
                            ` : ''}
                        </article>
                    `;
                }).join('');

            } catch (error) {
                container.innerHTML = `
                    <article class="blog-post">
                        <h2>Welcome to Your Blog!</h2>
                        <div class="post-meta">
                            November 18, 2025
                        </div>
                        <p class="post-excerpt">
                            Your blog is ready! Create a <code style="background: #27272a; padding: 0.2rem 0.4rem; border-radius: 3px;">posts.json</code> file in your repository, then visit <a href="admin.html" style="color: #fafafa;">the admin panel</a> to start adding posts.
                        </p>
                        <div class="tags">
                            <span class="tag">#welcome</span>
                        </div>
                    </article>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
